services:
  certbot:
    profiles: [tls]
    build:
      context: ./certbot
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./certbot/letsencrypt
        target: /etc/letsencrypt
      - type: bind
        source: ./nginx/html
        target: /usr/share/nginx/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 10d & wait $${!}; done; chown -R $(whoami):$(whoami) ~'"
    tty: true
    depends_on:
      proxy:
        condition: service_started
    networks:
      app_net:
  proxy:
    profiles: [tls]
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        DOMAIN: $DOMAIN
        PORT: $PORT
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
    env_file:
      - .env
    tty: true
    volumes:
      - type: bind
        source: ./nginx/modsecurity/
        target: /etc/modsecurity.d/
      - type: bind
        source: ./nginx/log
        target: /var/log/nginx
      - type: bind
        source: ./certbot/letsencrypt
        target: /etc/letsencrypt
      - type: bind
        source: ./nginx/html
        target: /usr/share/nginx/html
    depends_on:
      db:
        condition: service_healthy
    command: '/bin/sh -c ''nginx -t && while :; do sleep 20d & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
    restart: always
    healthcheck:
      test: service nginx status || exit 1
      interval: 5s
      retries: 10
      start_period: 5s
      timeout: 60s
    networks:
      nginx_net:
      app_net:
  app:
    build:
      context: .
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      PORT: 8080
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net
      - db_net
  db:
    image: postgres:14-alpine
    tty: true
    stdin_open: true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - type: volume
        source: dbvol
        target: /var/lib/postgresql/data
    restart: always
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 30s

volumes:
  dbvol:

networks:
  nginx_net:
  app_net:
  db_net:
    internal: true
